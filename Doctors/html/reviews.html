<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - التقييمات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/reviews.css">
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="sidebar-brand">عناية</div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> لوحة التحكم</a></li>
                <li><a href="patients-list.html"><i class="fa-solid fa-users"></i> قائمة المرضى</a></li>
                <li class="messages-item">
                    <a href="messages.html"><i class="fa-solid fa-comment-dots"></i> الرسائل</a>
                    <span class="badge">2</span>
                </li>
                <li><a href="appointments.html"><i class="fa-solid fa-calendar-days"></i> المواعيد والإشعارات</a></li>
                <li><a href="insurance.html"><i class="fa-solid fa-shield-halved"></i> التأمين الصحي</a></li>
                <li class="active"><a href="reviews.html"><i class="fa-solid fa-star"></i> التقييمات</a></li>
                <li><a href="promo-codes.html"><i class="fa-solid fa-ticket"></i> أكواد الخصم</a></li>
            </ul>
            <div class="sidebar-logout">
                <button class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج</button>
            </div>
        </aside>

        <main class="main-content">
            
            <nav class="navbar">
                <div class="nav-right">
                    <button class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                </div>
                <div class="nav-left">
                    <div class="notification-icon">
                        <i class="fa-regular fa-bell"></i>
                        <span class="nav-badge"></span>
                    </div>
                    <div class="user-avatar">
                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>
            </nav>

            <div class="page-header">
                <div class="title-wrapper">
                    <h1 class="page-title">التقييمات</h1>
                    <span class="bg-star-icon"><i class="fa-solid fa-star"></i></span>
                </div>
                <p class="page-subtitle">آراء المرضى وتقييماتهم</p>
            </div>

            <section class="stats-cards">
                <div class="card stat-card">
                    <h3>عدد التقييمات</h3>
                    <div class="stat-number">80</div>
                </div>

                <div class="card stat-card">
                    <h3>متوسط التقييم</h3>
                    <div class="rating-average">4.9</div>
                    <div class="stars-row">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                    </div>
                </div>

                <div class="card stars-distribution-card">
                    <div class="dist-row">
                        <span class="label">5 نجوم</span>
                        <div class="progress-bar"><div class="progress-fill" style="width: 95%;"></div></div>
                        <span class="count">95</span>
                    </div>
                    <div class="dist-row">
                        <span class="label">4 نجوم</span>
                        <div class="progress-bar"><div class="progress-fill" style="width: 20%;"></div></div>
                        <span class="count">20</span>
                    </div>
                    <div class="dist-row">
                        <span class="label">3 نجوم</span>
                        <div class="progress-bar"><div class="progress-fill" style="width: 7%;"></div></div>
                        <span class="count">7</span>
                    </div>
                    <div class="dist-row">
                        <span class="label">2 نجوم</span>
                        <div class="progress-bar"><div class="progress-fill" style="width: 2%;"></div></div>
                        <span class="count">2</span>
                    </div>
                    <div class="dist-row">
                        <span class="label">1 نجمة</span>
                        <div class="progress-bar"><div class="progress-fill" style="width: 1%;"></div></div>
                        <span class="count">1</span>
                    </div>
                </div>
            </section>

            <section class="reviews-section card">
                <div id="reviews-container">
                    </div>
                
                <div class="load-more-container">
                    <button id="load-more-btn" class="btn-load-more">عرض المزيد</button>
                </div>
            </section>

        </main>
    </div>

    <script src="../java/reviews.js"></script>
</body>
</html>
