<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول وإنشاء حساب</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        
        <div id="register-card" class="card">
            <h2>إنشاء حساب جديد</h2>
            <form id="register-form">
                <div class="form-grid">
                    <div class="input-group">
                        <label>الاسم بالكامل</label>
                        <input type="text" id="reg-name" placeholder="أدخل اسمك بالكامل" required>
                        <span id="name-error" class="error-msg"></span>
                    </div>
                    <div class="input-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="reg-email" placeholder="اكتب بريدك الإلكتروني" required>
                        <span id="email-error" class="error-msg"></span>
                    </div>
                    <div class="input-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="reg-phone" placeholder="أدخل رقم هاتفك" required maxlength="11">
                        <span id="phone-error" class="error-msg"></span>
                    </div>
                    <div class="input-group">
                        <label>المدينة</label>
                        <select required>
                            <option value="" selected disabled hidden>اختر المدينة</option>
                            <option value="المنيا">المنيا</option>
                            <option value="المنيا الجديدة">المنيا الجديدة</option>
                            <option value="ملوي">ملوي</option>
                            <option value="سمالوط">سمالوط</option>
                            <option value="بني مزار">بني مزار</option>
                            <option value="مغاغة">مغاغة</option>
                            <option value="مطاي">مطاي</option>
                            <option value="أبو قرقاص">أبو قرقاص</option>
                            <option value="دير مواس">دير مواس</option>
                            <option value="العدوة">العدوة</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>كلمة المرور</label>
                        <input type="password" id="reg-password" placeholder="أدخل كلمة المرور" required>
                        <span id="password-error" class="error-msg"></span>
                    </div>
                    <div class="input-group">
                        <label>تأكيد كلمة المرور</label>
                        <input type="password" id="reg-confirm" placeholder="أكد كلمة المرور" required>
                        <span id="confirm-error" class="error-msg"></span>
                    </div>
                </div>

                <div class="user-type-section">
                    <label class="main-label">نوع الحساب:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="user-type" value="patient" checked> مريض</label>
                        <label><input type="radio" name="user-type" value="doctor"> طبيب</label>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">أوافق على <a href="#">الشروط والأحكام</a></label>
                </div>

                <button type="submit" class="btn-main">تسجيل</button>
            </form>

            <div class="divider"><span>أو</span></div>

            <div class="social-login">
                <button class="btn-social"><i class="fab fa-google" style="color: #db4437;"></i> الدخول بواسطة جوجل</button>
                <button class="btn-social"><i class="fab fa-facebook-f" style="color: #4267B2;"></i> الدخول بواسطة فيسبوك</button>
            </div>

            <p class="switch-text">لديك حساب بالفعل؟ <a href="#" id="go-to-login">تسجيل الدخول</a></p>
        </div>

        <div id="login-card" class="card hidden">
            <h2>مرحباً بك مجدداً!</h2>
            <p class="subtitle">سجل الدخول إلى حسابك</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="login-email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="login-password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="user-type-section">
                    <label class="main-label">تسجيل الدخول كـ:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="login-user-type" value="patient" checked> مريض</label>
                        <label><input type="radio" name="login-user-type" value="doctor"> طبيب</label>
                    </div>
                </div>

                <div class="form-actions">
                    <label><input type="checkbox"> تذكرني</label>
                    <a href="#" class="forgot-pass">هل نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-main">تسجيل الدخول</button>
            </form>

            <div class="divider"><span>أو</span></div>

            <div class="social-login">
                <button class="btn-social"><i class="fab fa-google" style="color: #db4437;"></i> الدخول بواسطة جوجل</button>
                <button class="btn-social"><i class="fab fa-facebook-f" style="color: #4267B2;"></i> الدخول بواسطة فيسبوك</button>
            </div>

            <p class="switch-text">ليس لديك حساب؟ <a href="#" id="go-to-register">سجل الآن</a></p>
        </div>

    </div>

    <script src="../js/login.js"></script>
</body>
</html>
