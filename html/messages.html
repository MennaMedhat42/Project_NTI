<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عناية - الرسائل</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/messages.css">
</head>
<body>

    <aside class="sidebar">
        <h4 class="text-center fw-bold mb-4">عناية</h4>
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie me-2"></i> لوحة التحكم</a>
            <a class="nav-link" href="patients-list.html"><i class="fa-solid fa-users me-2"></i> قائمة المرضى</a>
            <a class="nav-link active" href="messages.html"><i class="fa-solid fa-comments me-2"></i> الرسائل <span class="badge bg-danger ms-auto rounded-circle">2</span></a>
            <a class="nav-link" href="appointments.html"><i class="fa-solid fa-calendar-days me-2"></i> المواعيد و الإشعارات</a>
            <a class="nav-link" href="insurance.html"><i class="fa-solid fa-shield-halved me-2"></i> التأمين الصحي</a>
            <a class="nav-link" href="reviews.html"><i class="fa-solid fa-star me-2"></i> التقييمات</a>
            <a class="nav-link" href="promo-codes.html"><i class="fa-solid fa-ticket me-2"></i> أكواد الخصم</a>
            <hr class="text-secondary mx-3">
            <a class="nav-link text-secondary" href="login.html"><i class="fa-solid fa-right-from-bracket me-2"></i> تسجيل الخروج</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="messages-header d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-1 fw-bold text-dark">الرسائل</h4>
                <p class="text-muted mb-0 small">عرض ورد على رسائل مرضاك أولاً بأول</p>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="fw-semibold text-secondary">د. شهاب ناصر</span>
                <img src="../images/dr.shehab.jpeg" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
            </div>
        </div>

        <div class="chat-card container-fluid p-0">
            <div class="row g-0 w-100 h-100">
                
                <div class="col-md-4 patients-chat-list" id="patients-list-container">
                    </div>

                <div class="col-md-8 h-100 d-flex flex-column justify-content-between">
                    <div class="chat-window h-100">
                        
                        <div class="chat-window-header d-flex align-items-center gap-3">
                            <img id="active-patient-img" src="../images/download (3).jfif" class="rounded-circle" style="width: 45px; height: 45px; object-fit: cover;">
                            <div>
                                <h6 class="mb-0 fw-bold" id="active-patient-name">جاري تحميل المحادثة...</h6>
                                <small class="text-success" style="font-size: 11px;"><i class="fa-solid fa-circle fa-xs me-1"></i> نشط الآن</small>
                            </div>
                        </div>

                        <div class="chat-messages-area" id="chat-messages-container">
                            </div>

                        <div class="chat-input-area">
                            <form id="chat-form" class="d-flex gap-2">
                                <input type="text" id="message-input" class="form-control" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
                                <button type="submit" class="btn btn-send px-4">
                                    <i class="fa-solid fa-paper-plane"></i> إرسال
                                </button>
                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="../java/messages.js"></script>
</body>
</html>
