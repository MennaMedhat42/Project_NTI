<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الحجز بنجاح - عناية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d9488;
            --dark-navy: #0a1931;
            --light-bg: #f8fafc;
            --text-dark: #1e293b;
            --success: #10b981;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-dark); display: flex; align-items: center; min-height: 100vh; }

        .success-container { max-width: 550px; margin: auto; padding: 20px; width: 100%; }
        .success-card { background: white; border-radius: 24px; padding: 40px 30px; text-align: center; box-shadow: 0 10px 30px rgba(10, 25, 49, 0.05); border: 1px solid var(--border); }
        
        .icon-wrapper { width: 80px; height: 80px; background-color: #f0fdf4; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px auto; color: var(--success); font-size: 40px; border: 2px solid #bbf7d0; }
        
        .success-title { font-size: 24px; font-weight: 700; color: var(--dark-navy); margin-bottom: 10px; }
        .success-subtitle { font-size: 15px; color: #64748b; margin-bottom: 30px; }

        .appointment-badge { background-color: #f0fdfa; border: 1px solid #ccfbf1; padding: 15px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-around; }
        .badge-value { font-size: 15px; font-weight: 700; color: var(--dark-navy); display: block; }
        
        .ticket-number { font-size: 24px; font-weight: 700; color: var(--primary); margin: 15px 0; background: #fafafa; padding: 12px; border-radius: 8px; border: 1px dashed var(--border); }

        .action-buttons { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .btn { padding: 12px 25px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
        .btn-home { background-color: var(--primary); color: white; border: none; }
        .btn-home:hover { background-color: #0b7a70; }
        .btn-print { background-color: transparent; color: var(--dark-navy); border: 1px solid var(--border); }
        .btn-print:hover { background-color: #f1f5f9; }
    </style>
</head>
<body>

    <div class="success-container">
        <div class="success-card">
            <div class="icon-wrapper">✓</div>
            
            <h2 class="success-title">تم تأكيد الحجز بنجاح!</h2>
            <p class="success-subtitle">يسعدنا خدمتك عبر منصة عناية، تم حفظ موعدك وإرسال تفاصيل التذكرة لهاتفك.</p>
            
            <div class="appointment-badge">
                <div>
                    <span style="font-size: 13px; color:#64748b;">الطبيب المعالج</span>
                    <!-- تحديث الاسم الافتراضي -->
                    <span class="badge-value" id="success-doctor-name">د. شهاب ناصر </span>
                </div>
                <div style="border-right: 1px solid var(--border); padding-right: 20px;">
                    <span style="font-size: 13px; color:#64748b;">الموعد المحدد</span>
                    <span class="badge-value">غداً، 04:30 مساءً</span>
                </div>
            </div>

            <p style="font-size: 13px; color: #64748b; text-align: right; margin-bottom: 5px;">رقم تذكرة الحجز الإلكتروني:</p>
            <div class="ticket-number" id="ticket-id">ENA-2026-0000</div>

            <div class="action-buttons">
                <a href="index.html" class="btn btn-home">العودة للرئيسية (Home)</a>
                <button class="btn btn-print" onclick="window.print()">طباعة تفاصيل التذكرة الإلكترونية 🖨️</button>
            </div>
        </div>
    </div>

    <script>
        // 1. تحديث اسم الطبيب من الـ URL إذا وجد، وإلا فإنه يظل "د. أحمد حسن"
        const urlParams = new URLSearchParams(window.location.search);
        const doctorNameParam = urlParams.get('doctor');
        if (doctorNameParam) {
            document.getElementById('success-doctor-name').innerText = "د.شهاب ناصر " + doctorNameParam;
        }

        // 2. توليد رقم حجز عشوائي تلقائي
        const randomNum = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('ticket-id').innerText = `ENA-2026-${randomNum}`;
    </script>
</body>
</html>
