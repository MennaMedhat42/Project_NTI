<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حجز موعد</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">

                <i class="fa-solid fa-hospital"></i>

                <h2>عناية</h2>

            </div>

            <ul>

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        <span>الرئيسية</span>
                    </a>
                </li>

                <li class="active">
                    <a href="book-appointment.html">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>حجز موعد</span>
                    </a>
                </li>

                <li>
                    <a href="my-appointments.html">
                        <i class="fa-solid fa-calendar-check"></i>
                        <span>مواعيدي</span>
                    </a>
                </li>

                <li>
                    <a href="timeline.html">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span>السجل الطبي</span>
                    </a>
                </li>

                <li>
                    <a href="e-prescription.html">
                        <i class="fa-solid fa-file-prescription"></i>
                        <span>الوصفات الطبية</span>
                    </a>
                </li>

                <li>
                    <a href="reports.html">
                        <i class="fa-solid fa-file-medical"></i>
                        <span>التقارير</span>
                    </a>
                </li>

                <li>
                    <a href="messages.html">
                        <i class="fa-solid fa-comments"></i>
                        <span>الرسائل</span>
                    </a>
                </li>

                <li>
                    <a href="notifications.html">
                        <i class="fa-solid fa-bell"></i>
                        <span>الإشعارات</span>
                    </a>
                </li>

                <li>
                    <a href="profile.html">
                        <i class="fa-solid fa-user"></i>
                        <span>الملف الشخصي</span>
                    </a>
                </li>

                <li>
                    <a href="settings.html">
                        <i class="fa-solid fa-gear"></i>
                        <span>الإعدادات</span>
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main -->

        <main class="main">

            <header>

                <div>

                    <h1>حجز موعد</h1>

                    <p>اختر بيانات الموعد المناسب لك</p>

                </div>

            </header>

            <div class="booking-form">

                <!-- المدينة -->

                <div class="form-group">

                    <label for="city">المدينة</label>

                    <select id="city">

                        <option value="">اختر المدينة</option>

                        <option value="Minia">المنيا</option>

                        <option value="Mallawi">ملوي</option>

                        <option value="Samalut">سمالوط</option>

                        <option value="Bani Mazar">بني مزار</option>

                        <option value="Matai">مطاي</option>

                        <option value="Abu Qurqas">أبو قرقاص</option>

                        <option value="Maghagha">مغاغة</option>

                        <option value="Al Adwa">العدوة</option>

                        <option value="Deir Mawas">دير مواس</option>

                        <option value="New Minia">المنيا الجديدة</option>

                    </select>

                </div>

                <!-- التخصص -->

                <div class="form-group">

                    <label for="specialty">التخصص</label>

                    <select id="specialty">

                        <option value="">اختر التخصص</option>

                        <option value="Dermatologist">الجلدية</option>

                        <option value="Dentist">الأسنان</option>

                    </select>

                </div>

                <!-- الطبيب -->

                <div class="form-group">

                    <label for="doctor">اختر الطبيب</label>

                    <select id="doctor">

                        <option value="">اختر الطبيب</option>

                    </select>

                </div>

                <!-- التاريخ -->

                <div class="form-group">

                    <label for="date">التاريخ</label>

                    <input type="date" id="date">

                </div>

                <!-- الوقت -->

                <div class="form-group">

                    <label for="time">الوقت</label>

                    <input type="time" id="time">

                </div>

                <!-- زر التالي -->

                <button type="button" id="nextBtn" class="book-btn">

                    التالي

                </button>

            </div>

        </main>

    </div>

    <script src="../js/book-appointment.js"></script>

</body>

</html>
