<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-hospital"></i>
                   <h2>عناية</h2>
            </div>

            <ul>

                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        <span>الرئيسية</span>
                    </a>
                </li>

                <li>
                    <a href="book-appointment.html">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>حجز موعد</span>
                    </a>
                </li>

                <li>
                    <a href="my-appointments.html">
                        <i class="fa-solid fa-calendar-check"></i>
                        <span>مواعيدي</span>
                    </a>
                </li>

                <li>
                    <a href="Timeline.html">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span>السجل الطبي</span>
                    </a>
                </li>

                <li>
                    <a href="e-prescription.html">
                        <i class="fa-solid fa-file-prescription"></i>
                        <span>الوصفات الطبية</span>
                    </a>
                </li>

                <li>
                    <a href="reports.html">
                        <i class="fa-solid fa-file-medical"></i>
                        <span>التقارير</span>
                    </a>
                </li>

                <li>
                    <a href="messages.html">
                        <i class="fa-solid fa-comments"></i>
                        <span>الرسائل</span>
                    </a>
                </li>

                <li>
                    <a href="notifications.html">
                        <i class="fa-solid fa-bell"></i>
                        <span>الإشعارات</span>
                    </a>
                </li>

                <li class="active">
                    <a href="profile.html">
                        <i class="fa-solid fa-user"></i>
                        <span>الملف الشخصي</span>
                    </a>
                </li>

                <li>
                    <a href="settings.html">
                        <i class="fa-solid fa-gear"></i>
                        <span>الإعدادات</span>
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main -->

        <main class="main">

            <!-- Header -->

            <header>

                <div>

                    <h1>الملف الشخصي</h1>

                    <p>يمكنك عرض وتعديل بياناتك الشخصية</p>

                </div>

                <div class="user">

                    <i class="fa-solid fa-bell notification"></i>

                    <img id="headerImage" src="https://i.pravatar.cc/100?img=12" alt="Patient">

                    <div>

                        <h3 id="headerName">أحمد محمد</h3>

                        <small>مريض</small>

                    </div>

                </div>

            </header>

            <!-- Profile -->

            <section class="profile-card">

                <div class="profile-image">

                    <img id="profileImage" src="https://i.pravatar.cc/180?img=12" alt="Profile">

                    <input type="file" id="imageInput" accept="image/*" hidden>

                    <button type="button" id="changeImage">

                        <i class="fa-solid fa-camera"></i>

                        تغيير الصورة

                    </button>

                </div>

                <div class="profile-form">

                    <div class="form-group">

                        <label>الاسم بالكامل</label>

                        <input id="fullName" type="text" value="أحمد محمد">

                    </div>

                    <div class="form-group">

                        <label>البريد الإلكتروني</label>

                        <input id="email" type="email" value="ahmed@gmail.com">

                    </div>

                    <div class="form-group">

                        <label>رقم الهاتف</label>

                        <input id="phone" type="text" value="01012345678">

                    </div>

                    <div class="form-group">

                        <label>تاريخ الميلاد</label>

                        <input id="birthDate" type="date" value="2002-07-15">

                    </div>

                    <div class="form-group">

                        <label>النوع</label>

                        <select id="gender">

                            <option value="ذكر">ذكر</option>

                            <option value="أنثى">أنثى</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>العنوان</label>

                        <input id="address" type="text" value="المنيا - مصر">

                    </div>

                    <button type="button" class="save-btn" id="saveProfile">

                        حفظ التعديلات

                    </button>

                </div>

            </section>

        </main>

    </div>

    <script src="../js/profile.js"></script>
    <script src="../js/navbar.js"></script>


</body>

</html>
