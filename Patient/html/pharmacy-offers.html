<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عروض الصيدلية</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pharmacy-offers.css">
</head>

<body>

    <main class="main">

        <!-- Header -->

        <header>

            <div>
                <h1>عروض الصيدلية</h1>
                <p>استفد من أفضل العروض والخصومات على الأدوية والمنتجات الطبية</p>
            </div>
            <div class="user">
                <i class="fa-solid fa-bell notification"></i>

                <img id="headerImage" src="https://i.pravatar.cc/100?img=12" alt="Patient">

                <div id="profileLink">
                    <h3 id="headerName">أحمد محمد</h3>
                    <small>مريض</small>
                </div>
            </div>
        </header>

        <!-- Search -->

        <div class="search-box">

            <input type="text" placeholder="ابحث عن منتج...">

            <button>
                <i class="fa-solid fa-search"></i>
            </button>

        </div>

        <!-- Offers -->

        <section class="offers">

            <!-- Offer 1 -->

            <div class="offer-card">

                <img src="../img/omega.jpg" alt="Medicine">

                <div class="offer-info">

                    <h2>Omega 3 Plus</h2>

                    <p>خصم 25% على العبوة</p>

                    <span class="price">
                        <del>145 جنيه</del>
                        108.75 جنيه
                    </span>

                    <button class="offer-btn" data-points="50">
                        استفد بالعرض (50 نقطة)
                    </button>

                </div>

            </div>

            <!-- Offer 2 -->

            <div class="offer-card">

                <img src="../img/images.jpg" alt="Medicine">

                <div class="offer-info">

                    <h2>Scaro</h2>

                    <p>خصم 50% لفترة محدودة</p>

                    <span class="price">
                        <del>999 جنيه</del>
                        499.5 جنيه
                    </span>

                    <button class="offer-btn" data-points="100">
                        استفد بالعرض (100 نقطة)
                    </button>

                </div>

            </div>

            <!-- Offer 3 -->

            <div class="offer-card">

                <img src="../img/images (1).jpg" alt="Medicine">

                <div class="offer-info">

                    <h2>Teeth Whitening Kit</h2>

                    <p>خصم 50% لفترة محدودة</p>

                    <span class="price">
                        <del>60 جنيه</del>
                        30 جنيه
                    </span>

                    <button class="offer-btn" data-points="150">
                        استفد بالعرض (150 نقطة)
                    </button>

                </div>

            </div>

        </section>

    </main>

    <script src="../js/pharmacy-offers.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/navbar.js"></script>

</body>

</html>
